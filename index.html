<html lang="fr">
<head>

    <title>LABVAPE — Assistant Conseil & Outils Professionnels</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">

    <style>
        /* 🎨 DIRECTION ARTISTIQUE LABVAPE PREMIUM */
        :root {
            --bg-dark: #0b0f19;        /* Fond de page ultra-sombre tech */
            --bg-card: #131c2e;        /* Fond des blocs de calcul */
            --vape-blue: #00d2ff;      /* Cyan électrique signature */
            --vape-purple: #7000ff;    /* Violet néon pour les dégradés */
            --vape-green: #00ffaa;     /* Vert validation / sécurité */
            --vape-red: #ef4444;       /* Rouge danger */
            --text-main: #f1f5f9;      /* Blanc cassé pour la lisibilité */
            --text-muted: #64748b;     /* Texte secondaire */
            --border-color: #242936;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0 auto;
            padding: 20px 16px 8px 16px;
            max-width: 440px;
            letter-spacing: -0.2px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-x: hidden;
            position: relative;
        }

        /* Effets de halo lumineux d'arrière-plan */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.1) 0%, transparent 70%);
            top: -50px;
            left: -50px;
            z-index: 0;
            pointer-events: none;
        }

        /* EN-TÊTE & LOGO */
        header {
            position: relative;
            z-index: 10;
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
            animation: fadeInDown 0.6s ease;
        }

        .logo-container {
            width: 160px;
            height: auto;
            margin: 0 auto 5px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo-container:hover {
            transform: scale(1.05);
        }

        .logo-img {
            width: 100%;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.15));
        }

        .logo-fallback {
            font-size: 2.5rem;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }

        /* BARRE D'ONGLETS STYLES */
        .tabs-container {
            position: relative;
            z-index: 10;
            overflow-x: auto;
            white-space: nowrap;
            margin-bottom: 20px;
            margin-left: -16px;
            margin-right: -16px;
            padding-left: 16px;
            padding-right: 16px;
            -webkit-overflow-scrolling: touch;
        }
        .tabs-container::-webkit-scrollbar {
            display: none;
        }

        .tabs {
            display: inline-flex;
            background: #111625;
            padding: 5px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--vape-blue), #0088ff);
            color: #050b14;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.25);
        }

        /* BLOCS DE CONTENU & FORMULAIRES */
        .tab-content {
            display: none;
            position: relative;
            z-index: 10;
            width: 100%;
        }
        .tab-content.active {
            display: block;
            animation: fadeInUp 0.4s ease;
        }

        h2 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            color: #94a3b8;
            margin-top: 10px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .box {
            background: rgba(19, 28, 46, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
        }

        label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            background: rgba(11, 15, 25, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 14px;
            box-sizing: border-box;
            outline: none;
            -webkit-appearance: none;
            transition: all 0.25s ease;
        }

        input:focus, select:focus {
            border-color: var(--vape-blue);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
            background: rgba(11, 15, 25, 0.9);
        }

        /* MESSAGES DE STATUT INTERACTIFS */
        .status {
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            margin-top: 14px;
            font-size: 13px;
            letter-spacing: 0.2px;
            transition: all 0.3s;
        }

        .safe {
            background: rgba(16, 185, 129, 0.08);
            color: var(--vape-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .danger {
            background: rgba(239, 68, 68, 0.08);
            color: var(--vape-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            animation: shake 0.4s ease;
        }

        .neutral {
            background: rgba(255, 255, 255, 0.02);
            color: #94a3b8;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .money {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        /* AFFICHAGE DES RÉSULTATS GRAPHATIQUES */
        .res {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            margin-top: 4px;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.05);
        }

        .sub-res {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.5;
        }

        /* GRILLES DE CONFIGURATION */
        .preset-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .preset-btn {
            background: rgba(30, 35, 48, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s;
        }

        .preset-btn:hover {
            border-color: var(--vape-blue);
            background: rgba(30, 35, 48, 0.9);
        }

        .preset-btn:active {
            transform: scale(0.97);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        
        hr {
            border: 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin: 18px 0;
        }

        footer {
            position: relative;
            z-index: 10;
            margin-top: auto;
            padding: 40px 0 10px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            text-align: center;
        }

        /* STRUCTURE ADAPTATIVE GRAND ÉCRAN COMPTOIR (16:9) */
        @media(min-width:768px){
            body { max-width: 1050px; padding: 30px; }
            .desk-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 24px; align-items: start; }
            .desk-layout > div { margin-bottom: 0; }
            h2 { margin-top: 5px; }
        }

        /* ANIMATIONS CIBLÉES */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
