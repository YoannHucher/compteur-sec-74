    <style>
        /* 📱 VARIABLES VARIABLES DE THÈMES (CLAIR PAR DÉFAUT / SOMBRE INCLUS) */
        :root {
            --bg-body: #f3f7fa; 
            --bg-card: #ffffff; 
            --bg-input: #edf4f9; 
            --border-light: #e2eef5;
            
            --primary: #8b5cf6; 
            --primary-light: #ddd6fe;
            --secondary: #06b6d4; 
            --danger: #ef4444;
            
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        /* 🌙 COULEURS DU THÈME SOMBRE (ANCIENNE VERSION MIDNIGHT) */
        [data-theme="dark"] {
            --bg-body: #0b0f19; 
            --bg-card: #131a26; 
            --bg-input: #1c2635; 
            --border-light: #233044;
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* 👑 HEADER PRINCIPAL */
        .app-header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-light);
            padding: 10px 15px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.02);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .vape-logo-left {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }
        .vape-logo-left img {
            height: 45px;
            width: auto;
            display: block;
        }

        .tools-nav-horizontal {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 3px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            flex-grow: 1;
            align-items: center;
        }

        .tools-nav-horizontal::-webkit-scrollbar {
            display: none;
        }
        .tools-nav-horizontal {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* DESIGN ADAPTATIF POUR ORDINATEUR */
        @media (min-width: 900px) {
            .app-header {
                justify-content: center;
                padding: 12px 40px;
                gap: 40px;
            }
            .vape-logo-left img {
                height: 90px; 
            }
            .tools-nav-horizontal {
                flex-grow: 0;
            }
        }

        .nav-item-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px; 
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .nav-item-btn:hover {
            border-color: #cbd5e1;
            color: var(--text-main);
        }
        
        .nav-item-btn.active {
            background: var(--bg-card);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.1);
        }

        /* 🌓 BOUTON TOGGLE THÈME */
        .theme-toggle-btn {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            color: var(--text-main);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            width: 38px;
            height: 38px;
            box-sizing: border-box;
        }
        @media (min-width: 900px) {
            .theme-toggle-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }

        /* 📦 CONTENEUR CENTRAL SOUPLE */
        .main-container {
            max-width: 760px;
            width: 100%;
            margin: 20px auto;
            padding: 0 15px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .window-card {
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border-light);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02);
            padding: 25px;
            box-sizing: border-box;
            width: 100%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        @media (min-width: 768px) {
            .window-card { padding: 40px; }
        }

        .window-title {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px 0;
            color: var(--text-main);
            letter-spacing: -0.8px;
        }
        .window-desc {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .section-separator-title {
            font-size: 12px;
            font-weight: 800;
            color: var(--secondary);
            text-transform: uppercase;
            border-bottom: 2px solid rgba(6, 182, 212, 0.06);
            padding-bottom: 8px;
            margin: 25px 0 18px 0;
            letter-spacing: 1.2px;
        }

        input, select {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 14px 16px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 20px;
            transition: all 0.2s, background-color 0.3s ease, border-color 0.3s ease;
            -webkit-appearance: none;
        }
        input:focus, select:focus {
            border-color: var(--primary);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
        }

        .result-panel {
            background: var(--bg-input);
            border-radius: 20px;
            padding: 25px;
            margin-top: 15px;
            border: 1px solid var(--border-light);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .result-panel label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
        }
        
        .result-value {
            font-size: 38px;
            font-weight: 900;
            color: var(--text-main);
            margin: 6px 0 14px 0;
            letter-spacing: -1.5px;
        }

        .status-text {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 12px;
            color: var(--secondary);
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .status-text.danger { color: var(--danger); }

        .sub-result-details {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-main);
            background: var(--bg-card);

            border-left: 4px solid var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.01);
            transition: background-color 0.3s ease;
        }
