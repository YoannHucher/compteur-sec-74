<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABVAPE — Système Intelligent</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/qMfNgwV9/Logo-Labvape.png">

    <style>
        :root {
            --bg-body: #f3f7fa; 
            --bg-card: #ffffff; 
            --primary: #8b5cf6; 
            --text-main: #1e293b;
        }

        body { font-family: sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; }

        /* HEADER : Structure robuste */
        .app-header {
            background: var(--bg-card);
            border-bottom: 1px solid #e2eef5;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* Logo fixe à gauche */
        .vape-logo img { height: 45px; display: block; }

        /* Navigation : Scroll sur mobile, centrée sur PC */
        .tools-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex: 1;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .tools-nav::-webkit-scrollbar { display: none; }

        /* Ajustement PC : On centre la navigation */
        @media (min-width: 900px) {
            .app-header { justify-content: center; }
            .tools-nav { flex: 0; justify-content: center; }
        }

        .nav-item-btn {
            background: #edf4f9;
            border: 1px solid #e2eef5;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav-item-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .main-container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .hidden-tab { display: none; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="vape-logo">
            <img src="https://i.ibb.co/qMfNgwV9/Logo-Labvape.png" alt="Logo">
        </div>
        <nav class="tools-nav">
            <button class="nav-item-btn active" id="btn-cdr" onclick="switchTab('cdr')">⚡ Accu</button>
            <button class="nav-item-btn" id="btn-nicotine" onclick="switchTab('nicotine')">💧 Nicotine</button>
            <!-- Ajoute tes autres boutons ici -->
        </nav>
    </header>

    <main class="main-container">
        <!-- Ton contenu -->
    </main>

    <script>
        // RÉACTIVATION DE LA SÉCURITÉ DE FERMETURE
        window.addEventListener('beforeunload', function (e) {
            e.preventDefault();
            e.returnValue = ''; // Déclenche la popup de confirmation
        });

        function switchTab(tabId) {
            // Logique de changement d'onglet
            document.querySelectorAll('.nav-item-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + tabId).classList.add('active');
        }
    </script>
</body>
</html>
